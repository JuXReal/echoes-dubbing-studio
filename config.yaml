# ==============================================================================
# Echoes Dubbing Studio v1.0.0 — Universal BYOD AI Voiceover & Dubbing Pipeline
# Multi-Game Compatible (Generic CSV/JSON Mods & Addon Packs)
# ==============================================================================

project:
  name: "echoes-dubbing-studio"
  version: "1.0.0"
  adapter: "wow_chatty"         # "generic" (CSV/JSON any game) or "wow_chatty" (ChattyLittleNpc addon pack)
  expansion: "Midnight"
  locale: "deDE"
  target_addon_name: "ChattyLittleNpc_Midnight_deDE_voiceovers"
  interface_version: "120107, 120105"
  pilot_limit: 20               # Number of benchmark entries for pilot runs (0 = all)

paths:
  # Local paths are automatically overridden by environment variables in .env
  wow_addons_dir: "/path/to/Game/AddOns"
  source_pack_dir: "/path/to/Game/AddOns/Source_Voiceovers"
  main_addon_dir: "/path/to/Game/AddOns/MainAddon"
  saved_variables_lua: "/path/to/Game/SavedVariables/RecordedTexts.lua"
  data_original: "data/original"
  data_custom_texts: "data/custom_texts"
  data_raw_de_text: "data/raw_de_text"
  data_reference_voices: "data/reference_voices"
  output_raw_tts: "output/raw_tts_wav"
  output_final_ogg: "output/final_ogg"
  output_qa_reports: "output/qa_reports"
  output_addon_pack: "output/Mastered_Voiceover_Pack"

voice_extraction:
  sample_rate: 24000
  channels: 1
  min_duration_sec: 6.0
  max_duration_sec: 10.0
  ideal_duration_sec: 8.5
  silence_threshold_db: -42
  highpass_hz: 70
  lowpass_hz: 11500

llm_routing:
  tier1_local:
    provider: "lmstudio_or_rule_engine"
    endpoint: "http://localhost:1234/v1/chat/completions"
    model: "gemma-4-E4B-it"
    temperature: 0.1
  tier2_frontier:
    provider: "frontier_director"
    model: "gemini-4-argon"
    temperature: 0.35
    phonetic_lexicon:
      "Xal'atath": "Xallatath"
      "Quel'Thalas": "Kwell Thalas"
      "Quel'Danas": "Kwell Danas"
      "Zul'Aman": "Sul Aman"
      "Zul'jarra": "Sul Dschara"
      "Atal'Utek": "Atall Uteck"
      "Ula'tek": "Ulla Teck"
      "Kith'ix": "Kithicks"
      "Lor'themar Theron": "Lorthemar Theron"
      "Lor'themar": "Lorthemar"
      "Alleria": "Alleria"
      "Turalyon": "Turaljon"
      "Arator": "Arator"
      "Umbric": "Umbrik"
      "Liadrin": "Liadrin"
      "Halduron": "Halduron"
      "Amani": "Amani"
      "Aqir": "Akir"
      "Haranir": "Haranir"
      "Harandar": "Harandar"
      "Er'inye": "Erinje"
      "Thrall": "Srohl"
      "Jaina": "Dscheina"
      "Anduin Wrynn": "Anduin Rinn"
      "Sylvanas": "Silwanas"

ai:
  # Optional AI phonetic repair & translation (Step 1 & Step 5 escalation).
  # SECURITY: API keys are NEVER stored here — they live in the git-ignored
  # .env file (AI_API_KEY) and are managed via the Web Studio settings panel.
  enabled: true                    # Master switch (AI_ENABLED in .env overrides)
  provider: "none"                 # none | openai | openrouter | google | deepseek | ollama (AI_PROVIDER overrides)
  base_url: ""                     # Optional override (AI_BASE_URL overrides)
  model: ""                        # Optional override (AI_MODEL overrides)
  trigger_after_failures: 3        # Call the AI repair after this many failed QA attempts
  temperature: 0.3
  timeout_sec: 45
  max_tokens: 1500
  translate_missing_quests: true   # Translate untranslated source texts via user's configured AI provider
  pricing:
    openai:     {input: 2.50, output: 10.00}
    openrouter: {input: 0.80, output: 3.50}
    google:     {input: 0.10, output: 0.40}
    deepseek:   {input: 0.27, output: 1.10}
    ollama:     {input: 0.0,  output: 0.0}

tts:
  engine: "xtts_v2"
  model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
  device: "cuda"
  use_fp16: true
  language: "de"
  temperature: 0.58
  length_penalty: 1.0
  repetition_penalty: 10.0
  top_k: 50
  top_p: 0.85
  speed: 1.02
  split_sentences: true
  high_voice_f0_threshold_hz: 240.0
  high_voice_temperature: 0.55
  high_voice_speed: 0.98

qa_validation:
  whisper_model: "large-v3"     # Options: tiny, base, small, medium, large-v3
  whisper_device: "cuda"
  whisper_compute_type: "float16"
  max_wer_threshold: 0.15       # 15% maximum combined error threshold
  max_retries: 3
  retry_temperature_step: -0.08
  retry_repetition_penalty_step: 1.5

audio_fx:
  loudnorm:
    integrated_lufs: -16.0
    true_peak_db: -1.5
    lra: 11.0
  ogg_export:
    codec: "libvorbis"
    quality: 4
    sample_rate: 44100
  eq_matching:
    # 15-Band Spectral EQ Matching: matches each synthesized take via FIR curve
    # (firequalizer) to the frequency spectrum of its original reference audio.
    enabled: true
    max_boost_db: 4.0
    max_cut_db: -6.0
    min_gain_db: 0.5
    body_boost_db: 1.5
    high_scale: 0.7
    bands: [80, 120, 180, 250, 350, 500, 700, 1000, 1400, 2000, 2800, 4000, 5600, 8000, 11000]
  race_profiles:
    "Blood Elf":
      description: "3.2 kHz presence boost, subtle hall reverb"
      af_chain: "equalizer=f=3200:width_type=q:width=1.2:g=1.8,aecho=0.8:0.88:25:0.08"
    "Void Elf":
      description: "Dual-phase chorus, dark reverb"
      af_chain: "aecho=0.8:0.88:45|90:0.16|0.10,equalizer=f=180:width_type=q:width=1.0:g=1.5,equalizer=f=4500:width_type=q:width=1.5:g=2.0"
    "Undead":
      description: "Highpass 130 Hz, 2.4 kHz boost, metallic double delay"
      af_chain: "highpass=f=130,equalizer=f=2400:width_type=q:width=1.5:g=3.0,aecho=0.8:0.85:35|70:0.25|0.18"
    "Entartung":
      description: "Pitch -4%, shadow echo"
      af_chain: "asetrate=24000*0.96,aresample=24000,atempo=1/0.96,aecho=0.8:0.88:55|110:0.22|0.14"
    "Troll":
      description: "140 Hz bass boost, temple echo"
      af_chain: "equalizer=f=140:width_type=q:width=1.1:g=2.5,aecho=0.8:0.88:30:0.10"
    "Tauren":
      description: "Pitch -6%, 110 Hz warm chest resonance"
      af_chain: "asetrate=24000*0.94,aresample=24000,atempo=1/0.94,equalizer=f=110:width_type=q:width=1.0:g=4.0"
    "Gnome":
      description: "Pitch +6%, highpass 120 Hz"
      af_chain: "asetrate=24000*1.06,aresample=24000,atempo=1/1.06,highpass=f=120"
    "Goblin":
      description: "Pitch +5%, 1.8 kHz nasal presence boost"
      af_chain: "asetrate=24000*1.05,aresample=24000,atempo=1/1.05,equalizer=f=1800:width_type=q:width=1.2:g=2.5"
    "Radio":
      description: "Bandpass 350-3400 Hz, tactical comms saturation"
      af_chain: "highpass=f=350,lowpass=f=3400,equalizer=f=1600:width_type=q:width=1.0:g=3.5"
    "Helmet":
      description: "Enclosed visor resonance + short metallic reflection"
      af_chain: "highpass=f=110,lowpass=f=7500,equalizer=f=900:width_type=q:width=1.4:g=2.5,aecho=0.8:0.85:12:0.15"
    "Default":
      description: "Highpass 75 Hz, 3 kHz clarity boost"
      af_chain: "highpass=f=75,equalizer=f=3000:width_type=q:width=1.4:g=1.2"

web:
  host: "127.0.0.1"
  port: 8765
